name: Deploy migrations

# Pushes supabase/migrations to the dev project on every merge to main.
# Production runs only by hand, and the production environment asks for approval.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: Which Supabase project
        type: choice
        options: [dev, production]
        default: dev

concurrency: deploy-migrations-${{ inputs.target || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push
