name: Deploy migrations

# Pushes supabase/migrations to the dev project on every merge to main.
# Production runs only by hand, and the production environment asks for approval.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: Which Supabase project
        type: choice
        options: [dev, production]
        default: dev

concurrency: deploy-migrations-${{ inputs.target || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      # Until the access token, database password and project ref are set for this
      # environment, skip with a warning instead of failing every merge to main.
      - name: Check configuration
        id: config
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("secret SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("secret SUPABASE_DB_PASSWORD")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("variable SUPABASE_PROJECT_REF")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Migrations not deployed. Missing in the ${{ inputs.target || 'dev' }} environment: $(IFS=,; echo "${missing[*]}")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.config.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: steps.config.outputs.ready == 'true'
        run: supabase db push
