name: Credential check

# Once a week, checks that the Supabase access token, each database password and each
# anon key still work, and warns before GitHub's 60-day rule switches off the scheduled
# workflows in this public repo. A failure opens (or comments on) a "Credential check
# failed" issue, and GitHub emails about the failed run.
# The Gmail SMTP app password and the Google client secret live only in Supabase, so
# they aren't checked here.
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  supabase:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev, production]
    environment: ${{ matrix.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Check configuration
        run: |
          : > problems.txt
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || echo "secret SUPABASE_ACCESS_TOKEN is not set" >> problems.txt
          [ -n "$SUPABASE_DB_PASSWORD" ] || echo "secret SUPABASE_DB_PASSWORD is not set" >> problems.txt
          [ -n "$SUPABASE_PROJECT_REF" ] || echo "variable SUPABASE_PROJECT_REF is not set" >> problems.txt
          [ -n "$SUPABASE_URL" ] || echo "variable SUPABASE_URL is not set" >> problems.txt
          [ -n "$SUPABASE_ANON_KEY" ] || echo "variable SUPABASE_ANON_KEY is not set" >> problems.txt
      - name: Access token and project status
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          code=$(curl -sS -o project.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" || true)
          if [ "$code" = 401 ] || [ "$code" = 403 ]; then
            echo "SUPABASE_ACCESS_TOKEN was rejected (HTTP $code): it has expired or been revoked" >> problems.txt
          elif [ "$code" != 200 ]; then
            echo "Supabase API returned HTTP $code for project $SUPABASE_PROJECT_REF" >> problems.txt
          else
            status=$(jq -r .status project.json)
            [ "$status" = ACTIVE_HEALTHY ] || echo "project $SUPABASE_PROJECT_REF status is $status (paused?)" >> problems.txt
          fi
      - name: Anon key
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/grids?select=id&limit=1" || true)
          [ "$code" = 200 ] || echo "anon key request to $SUPABASE_URL returned HTTP $code" >> problems.txt
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          version: latest
      - name: Database password
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          # migration list connects to the remote database with the password.
          if ! { supabase link --project-ref "$SUPABASE_PROJECT_REF" && supabase migration list; } > db.log 2>&1; then
            cat db.log
            echo "SUPABASE_DB_PASSWORD did not connect to the database (see the run log)" >> problems.txt
          fi
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s problems.txt ]; then echo "All ${{ matrix.target }} credentials work."; exit 0; fi
          body=$(printf '**%s** environment, [run](%s):\n\n' "${{ matrix.target }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            sed 's/^/- /' problems.txt)
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/report-issue.sh "Credential check failed (${{ matrix.target }})" "$body" \
            || echo "::warning::Could not open an issue"
          exit 1

  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # GitHub disables scheduled workflows in a public repo after 60 days without
      # activity, which would stop the keep-alive and the backups without notice.
      - name: Days since the last commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Last commit was $days days ago."
          if [ "$days" -ge 45 ]; then
            bash .github/scripts/report-issue.sh "Commit soon to keep scheduled workflows on" \
              "The last commit to the default branch was $days days ago. GitHub turns off scheduled workflows (keep-alive, backups, this check) after 60 days without activity. Any commit resets the clock."
            exit 1
          fi
